<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cherry</title>

<!--
  ============================================================
  heavenlyside5.naru.pub 스타일 (흰색 + 회색 미니멀) 레이아웃.
  포인트 컬러는 아래 :root 의 --accent 한 줄만 바꾸면 전체에 적용돼요.
  이미지(배너, 앨범아트 등)는 비워뒀으니 직접 넣을 자리에
  img 태그의 src만 채워 넣으면 됩니다.

  섹션 순서 (전과 동일한 레이아웃 유지):
   1. 사이트 제목 / 소개 문구
   2. 공지사항 한 줄
   3. 구분선
   4. 앨범아트 / 플레이어 영역
   5. 방명록 링크
   6. 카피라이트
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">

<style>
    :root {
        /* 포인트 색상만 여기서 지정해 주세요. 나머지는 전부 흰색/회색입니다. */
        --accent: #999999;

        --white: #ffffff;
        --gray-50: #fafafa;
        --gray-100: #f2f2f2;
        --gray-200: #e4e4e4;
        --gray-300: #cccccc;
        --gray-500: #999999;
        --gray-700: #555555;
        --gray-900: #222222;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 100vw;
        min-height: 100vh;
        background: var(--gray-100);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 48px 16px;
        font-family: 'Nanum Gothic', sans-serif;
        color: var(--gray-700);
    }

    /* ===== 전체 프레임 ===== */
    .site {
        width: 700px;
        max-width: 100%;
        background: var(--white);
        border: 1px solid var(--gray-300);
    }

    /* ===== 1. 소개 영역 ===== */
    .intro {
        padding: 30px 32px 20px;
        text-align: center;
        border-bottom: 1px solid var(--gray-200);
    }
    .intro h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 3px;
        color: var(--gray-900);
    }
    .intro .sub {
        margin-top: 12px;
        font-size: 13px;
        color: var(--gray-500);
        line-height: 1.8;
    }
    .intro .env-note {
        margin-top: 14px;
        font-size: 11px;
        color: var(--gray-300);
    }

    /* ===== 2. 공지 한 줄 ===== */
    .notice-wrap {
        overflow: hidden;
        white-space: nowrap;
        padding: 8px 0;
        border-bottom: 1px solid var(--gray-200);
        background: var(--gray-50);
    }
    .notice-track {
        display: inline-block;
        padding-left: 100%;
        font-size: 11px;
        color: var(--gray-700);
        animation: marquee 16s linear infinite;
    }
    @keyframes marquee {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }
    @media (prefers-reduced-motion: reduce) {
        .notice-track { animation: none; padding-left: 0; }
    }

    /* ===== 3. 구분선 ===== */
    .dots {
        text-align: center;
        letter-spacing: 6px;
        color: var(--gray-300);
        font-size: 11px;
        padding: 18px 0 4px;
    }

    /* ===== 4. 앨범 / 플레이어 영역 =====
       cover 안에 이미지를 넣지 않으면 회색 placeholder 박스로 보여요. */
    .player {
        margin: 10px 32px 0;
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 14px;
        border: 1px solid var(--gray-200);
        background: var(--gray-50);
    }
    .player .cover {
        width: 64px;
        height: 64px;
        flex: none;
        overflow: hidden;
        border: 1px solid var(--gray-300);
        background: var(--gray-100);
    }
    .player .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .player .meta {
        flex: 1;
        min-width: 0;
    }
    .player .status {
        font-size: 11px;
        color: var(--gray-500);
        letter-spacing: 1px;
    }
    .player .controls {
        margin-top: 6px;
        font-size: 15px;
        color: var(--accent);
        display: flex;
        gap: 14px;
    }
    .player .controls span {
        cursor: pointer;
        user-select: none;
    }

    /* ===== 5. 방명록 버튼 ===== */
    .guest {
        text-align: center;
        margin: 20px 0 6px;
    }
    .guest a {
        display: inline-block;
        padding: 7px 20px;
        border: 1px solid var(--gray-300);
        color: var(--gray-700);
        font-size: 12px;
        text-decoration: none;
        letter-spacing: 1px;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .guest a:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--white);
    }

    /* ===== 7. 푸터 ===== */
    footer {
        text-align: center;
        font-size: 10px;
        color: var(--gray-300);
        padding: 22px 0 20px;
        letter-spacing: 0.5px;
    }

    @media (max-width: 480px) {
        .intro { padding: 24px 20px 16px; }
        .player { margin-left: 20px; margin-right: 20px; }
        .intro h1 { font-size: 19px; }
    }
</style>
</head>

<body>

<div class="site">

    <!-- 1. 사이트 제목 / 소개 -->
    <div class="intro">
        <h1>cherry</h1>
        <p class="sub">
            여기에 소개 문구를 적어주세요<br>
            예) 다장르 반이입 오픈드림 / 현재정착 : (작품명)
        </p>
        <p class="env-note">이 사이트는 데스크탑 환경에 최적화 되어 있습니다</p>
    </div>

    <!-- 2. 공지 한 줄 -->
    <div class="notice-wrap">
        <span class="notice-track">(2026.08.30) 사이트 리뉴얼 중... 배너교환 환영해요</span>
    </div>

    <div class="dots">• • • • • • • • • •</div>

    <!-- 4. 앨범 / 플레이어 (장식용, 실제 재생 기능 아님) -->
    <div class="player">
        <div class="cover">
            <!-- 앨범아트 넣을 자리: <img src="..." alt="앨범아트"> -->
        </div>
        <div class="meta">
            <div class="status">Loading...</div>
            <div class="controls">
                <span>⏮</span>
                <span>▷</span>
                <span>⏭</span>
            </div>
        </div>
    </div>

    <!-- 5. 방명록 -->
    <div class="guest">
        <a href="guest.html">+ 방명록</a>
    </div>

    <!-- 7. 푸터 -->
    <footer>(C) 2026. cherry. all rights reserved.</footer>

</div>

</body>
</html>
